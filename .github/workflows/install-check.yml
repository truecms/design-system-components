name: Install Check

on:
  push:
    branches:
      - 2.x
      - 'release/**'
  pull_request:
    branches:
      - 2.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-check:
    name: Node ${{ matrix.node-version }} install sweep
    # 24.x is informational (non-blocking) — see audit remediation M1
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22.x'
            suffix: '22.x'
          - node-version: '24.x'
            suffix: '24.x'
    continue-on-error: ${{ matrix.node-version == '24.x' }}
    uses: ./.github/workflows/reusable-quality-gates.yml
    with:
      node_version: ${{ matrix.node-version }}
      node_label: ${{ matrix.node-version }}
      report_suffix: install-check-${{ matrix.suffix }}
      artifact_name: install-check-artifacts-${{ matrix.suffix }}
      run_test_design_system: true
      tarball_summary_file: install-check-pack-summary.json
      tarball_install_prefix: install-all-tarballs

  dry-run-release:
    name: Dry run release validation
    needs: install-check
    uses: ./.github/workflows/reusable-quality-gates.yml
    with:
      node_version: '22.x'
      node_label: '22.x'
      report_suffix: dry-run
      artifact_name: dry-run-release-artifacts
      run_test_design_system: true
      run_release_dry_run: true
      write_changesets_summary: true
      tarball_summary_file: pack-summary.json
      tarball_install_prefix: dry-run-all-tarballs
