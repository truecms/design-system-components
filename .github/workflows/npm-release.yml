name: npm Release

on:
  workflow_dispatch:
    inputs:
      npm_scope:
        description: 'npm scope to publish packages under (include leading @)'
        default: '@truecms'
        required: false
      dist_tag:
        description: 'npm dist-tag to apply to published packages'
        default: latest
        required: false
      dry_run:
        description: 'Run Changesets publish with --dry-run to validate pipeline'
        type: boolean
        default: true
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '@truecms/**'

jobs:
  release-validation:
    name: Release quality gates
    uses: ./.github/workflows/reusable-quality-gates.yml
    with:
      node_version: '22.x'
      node_label: '22.x'
      report_suffix: release
      artifact_name: npm-release-artifacts
      run_test_unified: true
      run_build_unified: true
      tarball_summary_file: release-pack-summary.json
      tarball_install_prefix: release-all-tarballs
    secrets: inherit

  publish:
    name: Publish packages
    needs: release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure default branch fetched
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          if [ -z "${default_branch}" ]; then
            default_branch="2.x"
          fi
          token="${{ secrets.GITHUB_TOKEN }}"
          repo="${{ github.repository }}"
          if [ -n "${token}" ]; then
            git remote set-url origin "https://x-access-token:${token}@github.com/${repo}.git"
          else
            git remote set-url origin "https://github.com/${repo}.git"
          fi
          git fetch --no-tags --prune origin "${default_branch}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${default_branch}"; then
            if git rev-parse --verify "${default_branch}" >/dev/null 2>&1; then
              git branch -f "${default_branch}" "origin/${default_branch}" || true
            else
              git branch "${default_branch}" "origin/${default_branch}" || true
            fi
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack (pnpm shim)
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Resolve release parameters
        id: release-params
        run: node scripts/determine-release-params.js
        env:
          INPUT_SCOPE: ${{ inputs.npm_scope }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          FORCE_PUBLISH_FROM_TAG: ${{ vars.FORCE_PUBLISH_FROM_TAG }}
          FORCE_PUBLISH: ${{ vars.FORCE_PUBLISH }}
          ALLOW_PUBLISH_FROM_TAG: ${{ vars.ALLOW_PUBLISH_FROM_TAG }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Enforce Node 22 baseline
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node -v)"
          echo "Active Node version: ${node_version}"
          major="${node_version#v}"
          major="${major%%.*}"
          if [ "${major}" -lt 22 ]; then
            echo '::error::Node 22 or newer is required for publishing. Update the workflow configuration or run `nvm use 22` locally before retrying.'
            exit 1
          fi

      - name: Verify npm token secret configured
        if: steps.release-params.outputs.dry_run != 'true'
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo '::error::NPM_TOKEN_TRUECMS secret is not configured.'
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_TRUECMS }}

      - name: Configure npm authentication
        if: steps.release-params.outputs.dry_run != 'true'
        run: |
          pnpm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          pnpm config set @truecms:registry "https://registry.npmjs.org/"
          pnpm whoami || pnpm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_TRUECMS }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate no Pancake runtime dependencies
        run: |
          set -euo pipefail
          if rg -n --glob 'packages/*/package.json' '"(@truecms|@gov\\.au)/pancake[^"]*"' packages; then
            echo '::error::Pancake dependency detected in publishable package manifests.'
            exit 1
          fi
          echo 'No Pancake dependencies found in package manifests.'

      - name: Build unified package scaffold
        run: |
          set -euo pipefail
          pnpm run build:unified

      - name: Verify unified package artefacts
        run: |
          set -euo pipefail
          test -f packages/unified-design-system/dist/js/components.js
          test -f packages/unified-design-system/dist/js/components.d.ts
          test -f packages/unified-design-system/dist/css/govau-components.css
          test -f packages/unified-design-system/dist/css/govau-theme.css

      - name: Publish packages with Changesets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_TRUECMS }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_TRUECMS }}
          NPM_CONFIG_PROVENANCE: true
          RESOLVED_SCOPE: ${{ steps.release-params.outputs.scope }}
          RESOLVED_DIST_TAG: ${{ steps.release-params.outputs.dist_tag }}
          RESOLVED_DRY_RUN: ${{ steps.release-params.outputs.dry_run }}
        run: |
          set -euo pipefail

          scope="${RESOLVED_SCOPE:-@truecms}"
          dist_tag="${RESOLVED_DIST_TAG:-latest}"
          dry_run_flag="${RESOLVED_DRY_RUN:-true}"

          export NPM_PUBLISH_SCOPE="$scope"
          pnpm config set scope "${scope#@}"

          echo "Publishing with scope ${scope}, dist-tag ${dist_tag}, dry-run ${dry_run_flag}"

          args=(--tag "$dist_tag")
          if [ "$dry_run_flag" = "true" ]; then
            args+=(--dry-run)
          fi

          echo "Running: pnpm run release ${args[*]}"
          set +e
          pnpm run release ${args[@]} | tee changesets-publish.log
          status=$?
          set -e

          if grep -qiE "No packages are being published|No unpublished packages found" changesets-publish.log; then
            echo "::notice::No release plan detected. Retrying with --from-package."
            echo "Running: pnpm changeset publish --from-package ${args[*]}"
            pnpm changeset publish --from-package ${args[@]}
          else
            exit "$status"
          fi

      - name: Post-release cleanup
        if: always()
        run: |
          rm -rf dist/reports dist/tarballs
          if command -v pnpm >/dev/null 2>&1; then
            pnpm store prune || true
          fi
